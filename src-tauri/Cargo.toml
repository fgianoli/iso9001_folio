[package]
name = "commesse-app"
version = "0.2.0"
edition = "2021"
description = "Folio: codici, cartelle, clienti e archivio. App desktop (Tauri)."
license = "MIT"
authors = ["Federico Gianoli"]

[lib]
name = "commesse_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
commesse-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
